# Настройка CodeRabbit.
#
# Зачем файл вообще нужен. На бесплатном плане для открытых проектов
# CodeRabbit не ревьюит репозитории младше десяти звёзд — в каждом прогоне
# висело «Review skipped: this repository does not receive automatic reviews
# because it has fewer than 10 stars». Здесь автоматический разбор включён
# явно; если плана всё равно не хватит, запуск остаётся ручным — комментарием
# `@coderabbitai review` в самом PR.
#
# Остальное — про то, чтобы разбор был по делу: язык, что не смотреть и по
# каким правилам жить в этом коде. Правила не выдуманы, они из AGENTS.md.

language: ru-RU

# Тон: коротко и по существу, без похвал и без стихов.
tone_instructions: >-
  Пиши коротко и прямо, по-русски. Не хвали и не подбадривай. Называй
  конкретную строку и конкретное последствие: что сломается и у кого.
  Если замечание — вкусовщина, так и скажи, чтобы его можно было отклонить
  без спора.

reviews:
  profile: assertive
  high_level_summary: true
  poem: false

  auto_review:
    enabled: true
    # Черновики не трогаем: в них половина работы ещё не написана.
    drafts: false
    auto_incremental_review: true

  # Чужой код и сборки смотреть незачем: `submodules/` — чужой проект целиком,
  # `dist/` и `dist-electron/` — то, что собрано из исходников, а замечание к
  # собранному файлу починить нельзя.
  path_filters:
    - '!submodules/**'
    - '!apps/**'
    - '!dist/**'
    - '!dist-electron/**'
    - '!node_modules/**'
    - '!pnpm-lock.yaml'
    - '!resources/**'
    - '!**/*.png'
    - '!**/*.ico'
    - '!**/*.wav'

  path_instructions:
    - path: '**/*.ts'
      instructions: >-
        Главное правило проекта: сначала замерь, потом утверждай. Ищи код,
        который отчитывается успехом, не проверив результата — проглоченные
        ошибки (`catch {}`, `.catch(() => undefined)`), возврат пустого списка
        там, где на самом деле был отказ, сообщение «сделано» после вызова,
        код возврата которого никто не смотрел. Это здесь самый дорогой класс
        ошибок, и он уже стоил нескольких живых поломок.

        Проверки отвечают тремя способами: прошло, не прошло и «нечем мерить».
        Сворачивать «нечем мерить» в «не прошло» нельзя — на провал чинят
        работу, а на «нечем мерить» чинят прибор. Поэтому `!gate.passed`
        ошибочно: `!null` даёт истину.

        Комментарии по-русски и объясняют ЗАЧЕМ, а не ЧТО. Почти каждая
        странность в этом коде — след конкретного провала; если правка стирает
        такое объяснение, скажи об этом.

        Кириллица в именах TypeScript допустима и используется намеренно.

    - path: '**/*.{sh,ps1,yml,yaml}'
      instructions: >-
        В оболочке имена переменных только латиницей: `ПЕРЕМЕННАЯ=...` в bash
        не присваивание, а команда, и оболочка отвечает 127. Это ловилось
        трижды за день.

        В шагах CI `| tail` съедает код возврата — без `set -o pipefail`
        упавший прогон показывает «success». Проверяй, что провал виден.

        Пути с пробелами и кириллицей — норма для этого проекта. Смотри, не
        потеряются ли кавычки.

    - path: '**/*.vitest.test.ts'
      instructions: >-
        Проверка, которая не краснеет на сломанном коде, — украшение. Смотри,
        что именно утверждается: не сравнивается ли вычисленное значение само
        с собой, не меряется ли величина, которая подстраивается под окно
        (`scrollHeight` вслед за размером окна), не проверяется ли комментарий
        вместо кода.

        Обратные слэши в путях Windows пиши через `String.raw`: в обычных
        кавычках `\п` это просто «п», и проверка пути остаётся без единого
        слэша.
