# Драйвер рабочего стола macOS — на настоящем маке.
#
# Локального мака нет ни у кого, кто пишет этот драйвер, а «Универсальный
# доступ», CGEvent и System Events на слово проверить нельзя: без разрешения
# они не падают, а молча не делают ничего. Поэтому весь путь — найти окно,
# свернуть, увидеть свёрнутым, развернуть, поднять, напечатать — гоняется
# здесь, на macos-latest.
#
# Запускается пушем в ветки mac/** и руками
# (`gh workflow run check-darwin-driver.yml --ref <ветка>`). В основной CI не
# входит: там три платформы и никакого живого рабочего стола.
name: Darwin window driver

on:
  workflow_dispatch:
  push:
    branches: ['mac/**']

permissions:
  contents: read

jobs:
  check:
    name: Настоящее окно на macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm jarvis:mac-check
      # Видно ли драйверу окно Электрона. Приёмка сказала, что нет, — а окно
      # при этом поднималось по заголовку. Замер под Электроном разбирает, кто
      # из двух ответов врёт.
      - run: pnpm jarvis:window-check
      # Приёмка теми же слоями, которыми работает голос: своё окно Электрона,
      # настоящий драйвер, настоящая фраза. Отвечает тремя словами —
      # прошло / не прошло / нечем мерить.
      - name: Приёмка
        run: |
          set -o pipefail
          pnpm jarvis:qa 2>&1 | tee /tmp/qa.log | tail -40 || true

          # Известные дыры macOS названы поимённо.
          #
          # Так прогон остаётся полезным: постоянно красный перестают читать, а
          # замолчать провалы — значит врать. Поэтому здесь список того, что уже
          # известно и осознанно отложено, а ЛЮБОЙ другой провал валит прогон.
          #
          #   - сетка: оверлей не накрывает строку меню и док (1024×674 против
          #     1024×768). Человек сказал не трогать.
          #
          # Когда дыру закрывают, строку отсюда убирают — иначе список
          # превращается в кладбище.
          known='сетка:'
          fresh=$(grep -a 'НЕ ПРОШЛО' /tmp/qa.log | grep -av "$known" || true)
          if [ -n "$fresh" ]; then
            echo 'Новые провалы приёмки на macOS:'
            echo "$fresh"
            exit 1
          fi
          grep -a 'Всего' /tmp/qa.log || true
