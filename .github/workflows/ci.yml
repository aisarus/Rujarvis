name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows — главная платформа: там живут драйвер рабочего стола и
        # установщик. Linux — чтобы ядро не привязалось к Windows случайно.
        # macOS — вторая платформа для человека: туда идёт свой установщик, и
        # проверять его на слово нельзя, машины под рукой нет.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Installer script parses and its pure functions pass
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-install-script.ps1
