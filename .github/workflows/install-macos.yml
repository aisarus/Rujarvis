# Установщик macOS — вживую, на настоящем маке.
#
# 23 проверки `scripts/check-install-sh.sh` разбирают синтаксис и чистые
# функции. Этого мало: они не отвечают на вопрос, который задал человек —
# «точно всё встанет и будет работать?». Ответить на него может только
# настоящий прогон `install.sh` на macOS.
#
# Поэтому здесь установка идёт целиком: Homebrew, Node, pnpm, исходники,
# сборка, модели речи, ярлык `.app`. Без запуска приложения — у раннера нет
# ни микрофона, ни человека, — но всё, что до него, проверяется по-настоящему.
name: Install on macOS

on:
  workflow_dispatch:
  # Ветки разбора — не изменения кода.
  #
  # `coderabbit/**` делает `scripts/coderabbit-full-review.mjs`: это срезы уже
  # проверенного main, отданные боту на разбор. Прогонять на них сборку заново
  # незачем — main на них уже проверен, а полный обход создаёт сразу восемь
  # веток и жёг бы по дюжине прогонов, включая пятнадцатиминутную установку на
  # маке.
  pull_request:
    branches-ignore: ['coderabbit/**']
  push:
    branches: [main, 'mac/**', 'install/**']
  schedule:
    # Раз в неделю: ломается обычно не наш код, а то, что снаружи —
    # Homebrew, узлы npm, адреса моделей.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Проверки установщика
        run: bash scripts/check-install-sh.sh

      - name: Ветка PR — та самая, а не однофамилица
        # Установщик клонирует фиксированный aisarus/Rujarvis по ИМЕНИ ветки.
        #
        # Для PR из форка ветки с таким именем в основном репозитории может не
        # быть вовсе — а может быть чужая однофамилица, и тогда прогон поставит
        # и проверит не тот код, отчитавшись успехом. Сверяем имя с коммитом
        # головы PR: совпало — ставим, нет — говорим прямо, чем это кончилось.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          want='${{ github.event.pull_request.head.sha }}'
          have=$(git ls-remote https://github.com/aisarus/Rujarvis.git \
            "refs/heads/${GITHUB_HEAD_REF}" | cut -f1)
          echo "голова PR: $want"
          echo "в aisarus/Rujarvis: ${have:-нет такой ветки}"
          test "$have" = "$want" || {
            echo
            echo 'Установщик умеет ставить только из aisarus/Rujarvis по имени ветки,'
            echo 'а здесь это имя ведёт в другое место (PR из форка или ветку удалили).'
            echo 'Поставить ровно этот код нечем — и выдавать это за проверку нельзя.'
            exit 1
          }

      - name: Установка целиком
        # Ветка своя: установщик тянет исходники из GitHub, и на чужой ветке
        # он поставил бы не то, что проверяем. Что имя ведёт именно сюда,
        # проверено шагом выше.
        #
        # Модель распознавания закреплена. Без ключа установщик выбирает её по
        # машине, и два прогона становится не с чем сравнивать: первый дал 7
        # из 12, второй 6 — и поди пойми, речь просела или модель другая.
        run: |
          set -o pipefail
          bash install.sh --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"             --whisper-model tiny --no-launch 2>&1 | tee /tmp/install.log

      - name: Что получилось
        run: |
          set -e
          ROOT="$HOME/Library/Application Support/Rujarvis"
          echo "=== папка Джарвиса ==="
          ls -1 "$ROOT"

          echo "=== приложение собрано ==="
          test -f "$ROOT/src/dist/app/main.cjs" || { echo 'НЕТ dist/app/main.cjs'; exit 1; }

          echo "=== ярлык .app на месте ==="
          test -x "$HOME/Applications/Rujarvis.app/Contents/MacOS/Rujarvis" || { echo 'НЕТ запускаемого файла в .app'; exit 1; }
          test -f "$HOME/Applications/Rujarvis.app/Contents/Info.plist" || { echo 'НЕТ Info.plist'; exit 1; }
          grep -q NSMicrophoneUsageDescription "$HOME/Applications/Rujarvis.app/Contents/Info.plist" \
            || { echo 'В Info.plist нет ключа микрофона — macOS не даст записывать'; exit 1; }

          echo "=== модели речи скачаны ==="
          du -sh "$ROOT/models" 2>/dev/null || { echo 'НЕТ папки моделей'; exit 1; }
          find "$ROOT/models" -name '*.onnx' | head -5
          test -n "$(find "$ROOT/models" -name '*.onnx' -print -quit)" || { echo 'Ни одной модели .onnx'; exit 1; }

      - name: Повторная установка ничего не ломает
        # README обещает: «повторный запуск обновляет установку». Обещание
        # без проверки — просто слова, а повторно установщик запускают чаще
        # всего: за обновлением.
        #
        # Здесь же ловится и всё, что установщик делает не начисто: занятые
        # папки, второй ярлык, перекачка моделей.
        run: |
          set -o pipefail
          before=$(du -sk "$HOME/Library/Application Support/Rujarvis/models" | cut -f1)
          bash install.sh --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"             --whisper-model tiny --no-launch 2>&1 | tee /tmp/install2.log | tail -20
          after=$(du -sk "$HOME/Library/Application Support/Rujarvis/models" | cut -f1)

          test -f "$HOME/Library/Application Support/Rujarvis/src/dist/app/main.cjs"             || { echo 'после повторной установки нет собранного приложения'; exit 1; }
          test -x "$HOME/Applications/Rujarvis.app/Contents/MacOS/Rujarvis"             || { echo 'после повторной установки нет ярлыка'; exit 1; }

          echo "модели до ${before} КБ, после ${after} КБ"
          test "$after" -ge "$before" || { echo 'модели после повторного запуска поредели'; exit 1; }
          grep -q 'уже установлено' /tmp/install2.log             || echo 'предупреждение: модели, похоже, качались заново'

      - name: Речь работает по кругу
        # Синтез своим голосом и распознавание своим же слухом: это отвечает
        # на «будет ли он говорить и слышать», не требуя микрофона.
        #
        # Папку задаём внутри: `working-directory` не разворачивает ~ и плохо
        # дружит с пробелом в «Application Support».
        run: |
          # pipefail обязателен: без него `| tail` съедает код возврата, и
          # упавший прогон показывает «success». Поймано на первом же запуске —
          # приёмка упала с двумя провалами, а шаг был зелёным.
          set -o pipefail
          cd "$HOME/Library/Application Support/Rujarvis/src"
          # Код возврата запоминаем, а не выбрасываем: `|| true` прятал
          # упавший прогон, и порог ниже считался по обрезанному журналу —
          # то есть «нечем мерить» выдавалось за «прошло».
          #
          # Но и требовать нуля нельзя: сам скрипт отвечает тремя ответами, и
          # 1 у него значит «узнал не всё» — на whisper-tiny с синтетической
          # речью это НОРМА, ради которой порог ниже и заведён. Отказ — это 2:
          # «нечем мерить», нет голоса или модели. Проверено прогоном 25.09:
          # 7 из 12 при коде 1, и требование нуля свалило зелёный прогон.
          set +e
          pnpm jarvis:roundtrip 2>&1 | tee /tmp/roundtrip.log | tail -30
          roundtrip_code=$?
          set -e
          test "$roundtrip_code" -ne 2 || {
            echo 'jarvis:roundtrip: нечем мерить — нет голоса или модели'
            exit 1
          }
          grep -q 'из 12' /tmp/roundtrip.log || {
            echo "jarvis:roundtrip вернул $roundtrip_code и не дошёл до итога — порог считать не по чему"
            exit 1
          }

          # Имена переменных — латиницей: кириллица в bash не идентификатор,
          # оболочка принимает её за команду и отвечает 127. Поймано этим же
          # прогоном.
          #
          # Здесь нижняя граница, а не цель.
          #
          # У раннера встаёт whisper-tiny, а речь синтетическая — это худшие
          # условия, какие бывают. Первый прогон дал 7 из 12. Порог нужен не
          # чтобы гнаться за цифрой, а чтобы заметить обвал: если станет 2 из
          # 12, сломалось что-то в самой речи.
          heard=$(grep -oE '[0-9]+ из 12' /tmp/roundtrip.log | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "речь по кругу: $heard из 12 (нижняя граница 5)"
          test "$heard" -ge 5 || { echo 'речь просела ниже границы'; exit 1; }

      - name: Приёмка
        run: |
          set -o pipefail
          cd "$HOME/Library/Application Support/Rujarvis/src"
          set +e
          pnpm jarvis:qa 2>&1 | tee /tmp/qa.log | tail -40
          qa_code=$?
          set -e

          # Известные дыры macOS названы поимённо.
          #
          # Так CI остаётся полезным: постоянно красный прогон перестают
          # читать, а замолчать провалы — значит врать. Поэтому здесь список
          # того, что уже известно и осознанно отложено, а ЛЮБОЙ другой провал
          # валит прогон.
          #
          #   - сетка: оверлей не накрывает строку меню и док (1024×674 против
          #     1024×768). Человек сказал не трогать.
          #
          # Когда дыру закрывают, строку отсюда убирают — иначе список
          # превращается в кладбище.
          known='сетка:'
          fresh=$(grep -a 'НЕ ПРОШЛО' /tmp/qa.log | grep -av "$known" || true)
          if [ -n "$fresh" ]; then
            echo 'Новые провалы приёмки на macOS:'
            echo "$fresh"
            exit 1
          fi

          # Итог обязан быть. Без него прогон не дошёл до конца.
          #
          # Раньше здесь стояло `grep ... || true`, и оборванная приёмка —
          # упавший Электрон, убитый по тайм-ауту процесс — выглядела точно
          # так же, как чистая: ни одной строки «НЕ ПРОШЛО» в обрезанном
          # журнале нет. Это и есть «нечем мерить», выданное за «прошло».
          grep -a 'Всего' /tmp/qa.log || {
            echo 'Приёмка не дошла до итога: судить не по чему.'
            tail -40 /tmp/qa.log || true
            exit 1
          }

          # Код возврата смотрим отдельно и последним: известные дыры валят
          # приёмку законно, и гасить прогон из-за них нельзя — но и молчать
          # о коде, когда новых провалов нет, тоже.
          if [ "$qa_code" -ne 0 ]; then
            echo "Приёмка вернула $qa_code — все провалы в списке известных."
          fi

      - name: 'Компьютер-юз: шесть инструментов против живого окна'
        # На Windows их делает cua-driver, на маке — System Events и
        # CoreGraphics; форма ответов одна, и модель различия не видит. Значит
        # и проверять надо одинаково, а на маке эти шесть не проверял никто.
        #
        # Три ответа, а не два. Универсальный доступ на маке спрашивают у
        # человека, и без него CGEvent не падает, а молча ничего не делает —
        # худший из отказов. Код 2 у замера значит «нечем мерить»: на это
        # чинят машину, а не программу, и валить прогон нельзя.
        shell: bash
        run: |
          set -o pipefail
          cd "$HOME/Library/Application Support/Rujarvis/src"
          set +e
          pnpm jarvis:cua-check 2>&1 | tee /tmp/cua.log | tail -30
          cua_code=$?
          set -e
          if [ "$cua_code" -eq 2 ]; then
            echo 'Компьютер-юз: нечем мерить — у раннера нет Универсального доступа.'
            exit 0
          fi
          grep -a 'Всего' /tmp/cua.log || {
            echo 'Замер не дошёл до итога: судить не по чему.'
            exit 1
          }
          test "$cua_code" -eq 0 || { echo "Компьютер-юз на маке не работает (код $cua_code)"; exit 1; }

      - name: 'Вкладки: настоящий браузер и вторая вкладка'
        # Проверок на браузер не было ни на одной платформе, а поломок за один
        # день нашлось две: профиль складывался в путь виндового вида, и канал
        # был жёстко msedge, которого на маке обычно нет. Обе видны только
        # запуском — типы сходятся, проверки на строках сходятся, а браузер не
        # открывается.
        #
        # Страница своя, data:-адресом: чужой сайт однажды ляжет или поменяет
        # вёрстку, и красным будет не наш код.
        shell: bash
        run: |
          set -o pipefail
          cd "$HOME/Library/Application Support/Rujarvis/src"
          set +e
          pnpm jarvis:browser-check 2>&1 | tee /tmp/browser.log | tail -30
          br_code=$?
          set -e
          if [ "$br_code" -eq 2 ]; then
            echo 'Вкладки: нечем мерить — на раннере нет ни одного браузера.'
            exit 0
          fi
          grep -a 'Всего' /tmp/browser.log || {
            echo 'Замер не дошёл до итога: судить не по чему.'
            exit 1
          }
          test "$br_code" -eq 0 || { echo "Вкладки не работают (код $br_code)"; exit 1; }

      - name: Ставлю Claude Code и Codex — как их ставит человек
        # Подписки в прогоне нет и быть не может: Джарвис живёт на подписках,
        # а пароли в CI не носят. Но между «CLI установлен» и «агент ответил»
        # лежит дорога, на которой всё и ломалось: найти файл среди десятка
        # мест, куда его кладут разные менеджеры, запустить так, чтобы Node
        # согласился, собрать аргументы и получить внятный отказ вместо
        # падения. Эта дорога проверяется целиком.
        # Оба CLI, а не один: у тестера может быть любой из них, и
        # Кодекс до 26.09.2026 не проверялся живьём ни разу.
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: 'Claude Code и Codex: путь до подписки'
        shell: bash
        run: |
          set -o pipefail
          cd "$HOME/Library/Application Support/Rujarvis/src"
          set +e
          pnpm jarvis:cli-check 2>&1 | tee /tmp/cli.log | tail -30
          cli_code=$?
          set -e
          grep -a 'Всего' /tmp/cli.log || {
            echo 'Замер не дошёл до итога: судить не по чему.'
            exit 1
          }
          if [ "$cli_code" -eq 2 ]; then
            echo 'Claude Code: нечем мерить — без подписки дальше не пройти.'
            exit 0
          fi
          test "$cli_code" -eq 0 || { echo "Claude Code на маке не работает (код $cli_code)"; exit 1; }

      - name: Журнал установки, если что-то упало
        if: failure()
        run: tail -100 /tmp/install.log || true
