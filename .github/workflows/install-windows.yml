      - name: 'Руки Джарвиса через настоящий MCP-сервер'
        # Шестнадцать проверок тем же сервером, что у агента: окна, ввод в
        # браузер (подтверждённый обработчиком самой страницы), вкладки, запуск
        # непускавшейся программы и её закрытие, блендер. Всё это 26.09.2026
        # ломалось у живого человека по очереди, и каждая поломка была найдена
        # только живым прогоном. Здесь — чтобы починенное не ломалось заново.
        #
        # Блендера на раннере нет: его шаги — «нечем мерить», это код 2.
        shell: bash
        run: |
          set -o pipefail
          cd "$LOCALAPPDATA/Rujarvis/src"
          set +e
          pnpm jarvis:hands-check 2>&1 | tee /tmp/hands.log | tail -24
          code=$?
          set -e
          grep -a 'Всего' /tmp/hands.log || {
