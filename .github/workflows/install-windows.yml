          test "$code" -eq 0 || { echo "Распознавание на видеокарте не работает (код $code)"; exit 1; }

      - name: 'Онбординг: мастер настоящим окном, от языка до «Начать»'
        # Условие 3 автопилота: онбординг не ломается. До 27.09.2026 его не
