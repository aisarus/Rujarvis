            exit 1
          }
          if [ "$code" -eq 2 ]; then
            echo 'Руки: часть нечем мерить.'
            exit 0
          fi
          test "$code" -eq 0 || { echo "Руки Джарвиса не работают (код $code)"; exit 1; }

      - name: 'Окно входа: единственный шаг, который нельзя обойти'
        # Поломка, найденная живым прогоном 26.09.2026 у владельца: вкладка
        # «войти» открывала окно с «не является внутренней или внешней
        # командой». Свои кавычки вокруг пути Node экранировал, а cmd такого не
        # понимает. Проверяется настоящим запуском заглушки из папки С
        # ПРОБЕЛОМ: на пути без пробела часть поломок не видна.
        shell: bash
        run: |
          set -o pipefail
          cd "$LOCALAPPDATA/Rujarvis/src"
          set +e
          pnpm jarvis:login-check 2>&1 | tee /tmp/login.log | tail -20
          code=$?
          set -e
          grep -a 'Всего' /tmp/login.log || {
            echo 'Замер не дошёл до итога: судить не по чему.'
            exit 1
          }
          # Код 2 — «нечем мерить»: маковская ветка на Windows не проверяется.
          if [ "$code" -eq 2 ]; then
            echo 'Окно входа: часть нечем мерить.'
            exit 0
          fi
          test "$code" -eq 0 || { echo "Окно входа не работает (код $code)"; exit 1; }

      - name: Ставлю Claude Code и Codex — как их ставит человек
        # Подписки в прогоне нет и быть не может: Джарвис живёт на подписках,
        # а пароли в CI не носят. Но между «CLI установлен» и «агент ответил»
        # лежит дорога, на которой всё и ломалось: найти файл среди десятка
        # мест, куда его кладут разные менеджеры, запустить так, чтобы Node
        # согласился, собрать аргументы и получить внятный отказ вместо
        # падения. Эта дорога проверяется целиком.
        # Оба CLI, а не один: у тестера может быть любой из них, и
        # Кодекс до 26.09.2026 не проверялся живьём ни разу.
        run: npm install -g @anthropic-ai/claude-code @openai/codex

