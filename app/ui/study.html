<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file: data: blob:">
<title>Учёба</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e8eaef;
    --muted: #9aa1ae;
    --accent: #4fa3ff;
    --accent-ink: #06121f;
    --ok: #3ecf8e;
    --warn: #f2b84b;
    --bad: #ff6b6b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
  header { display: flex; align-items: center; gap: 6px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 600; font-size: 15px; margin-right: 14px; }
  header nav button { background: none; border: 0; padding: 6px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; }
  header nav button:hover { background: var(--panel-2); color: var(--text); }
  header nav button.active { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  header .status { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { overflow-y: auto; padding: 22px 28px 28px; }
  h1 { font-size: 21px; margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 15px; margin: 18px 0 8px; font-weight: 600; }
  .hint { color: var(--muted); margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .spread { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 13px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #3a4150; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.small { padding: 3px 9px; font-size: 12px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .item { display: flex; align-items: center; gap: 12px; }
  .item .what { flex: 1; min-width: 0; }
  .item.warn { border-color: rgba(242,184,75,.45); }
  .item.exam { border-color: rgba(79,163,255,.45); }
  .pill { font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .st-strong { color: var(--ok); background: rgba(62,207,142,.1); }
  .st-fragile { color: #b9c4d6; background: rgba(185,196,214,.08); }
  .st-weak { color: var(--warn); background: rgba(242,184,75,.12); }
  .st-covered { color: var(--muted); }
  .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--panel-2); margin-top: 8px; }
  .bar span { display: block; height: 100%; }
  .bar .s-strong { background: var(--ok); } .bar .s-fragile { background: #6b7a92; } .bar .s-weak { background: var(--warn); } .bar .s-covered { background: #353b48; }
  .lecture { margin-bottom: 12px; }
  .lecture .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .topic { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
  .question { font-size: 18px; font-weight: 600; margin: 6px 0 2px; }
  .translation { color: var(--muted); margin-bottom: 12px; }
  .option { display: block; width: 100%; text-align: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; margin-bottom: 7px; }
  .option:hover:not(:disabled) { border-color: #3a4150; }
  .option:disabled { cursor: default; }
  .option.right { border-color: var(--ok); background: rgba(62,207,142,.08); }
  .option.wrong { border-color: var(--bad); background: rgba(255,107,107,.08); }
  .option.picked { border-color: var(--accent); }
  .option .tr { color: var(--muted); font-size: 12.5px; }
  .option .why { font-size: 12.5px; margin-top: 4px; }
  .feedback { margin-top: 10px; }
  textarea { width: 100%; min-height: 70px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
  .flash { perspective: 1200px; max-width: 620px; margin: 20px auto; }
  .flash .face { min-height: 230px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-size: 19px; white-space: pre-wrap; cursor: pointer; }
  .flash .face .side { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .flash .face.back { font-size: 16px; }
  .center { text-align: center; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 600; }
  .steps li { margin-bottom: 4px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 20px; display: none; align-items: center; gap: 10px; }
  footer.on { display: flex; }
  footer audio { flex: 1; height: 32px; }
  .error { color: var(--bad); }
  [dir=rtl] { text-align: right; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand" id="brand">Учёба</span>
    <nav id="tabs"></nav>
    <span class="status" id="status"></span>
  </header>
  <main id="view"></main>
  <footer id="player"><span id="playerLabel" class="small muted"></span><audio id="audio" controls></audio><button class="btn small" id="playerClose"></button></footer>
</div>
<script src="study.js"></script>
</body>
</html>
