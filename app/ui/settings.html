<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob:">
<title>Rujarvis</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e8eaef;
    --muted: #9aa1ae;
    --accent: #4fa3ff;
    --accent-ink: #06121f;
    --ok: #3ecf8e;
    --warn: #f2b84b;
    --bad: #ff6b6b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 200px 1fr; height: 100%; }
  .app.wizard { grid-template-columns: 1fr; }
  nav { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
  .wizard nav { display: none; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; font-weight: 600; font-size: 16px; }
  .brand .dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 0 12px rgba(79,163,255,.5); }
  nav button { text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; }
  nav button:hover { background: var(--panel-2); color: var(--text); }
  nav button.active { background: var(--panel-2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
  main { overflow-y: auto; padding: 28px 32px 32px; }
  .wizard main { max-width: 640px; margin: 0 auto; width: 100%; padding-top: 40px; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
  h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .hint { color: var(--muted); margin: 0 0 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row + .row { margin-top: 10px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #3a4150; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: default; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--ok); background: rgba(62,207,142,.1); }
  .pill.warn { color: var(--warn); background: rgba(242,184,75,.1); }
  .pill.bad { color: var(--bad); background: rgba(255,107,107,.1); }
  .choice { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .choice button { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; cursor: pointer; text-align: left; }
  .choice button.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .choice b { display: block; font-size: 16px; margin-bottom: 2px; }
  .choice span { color: var(--muted); font-size: 13px; }
  select, input[type=text] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
  input[type=text] { flex: 1; }
  label.field { display: block; margin-bottom: 4px; font-weight: 600; }
  .path { font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; color: var(--muted); word-break: break-all; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .model { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .model:first-child { border-top: 0; }
  .model .desc { color: var(--muted); font-size: 12.5px; }
  .footer { display: flex; justify-content: space-between; margin-top: 24px; }
  .steps { display: flex; gap: 6px; margin-bottom: 24px; }
  .steps i { flex: 1; height: 4px; border-radius: 99px; background: var(--line); }
  .steps i.on { background: var(--accent); }
  .kbd { font-family: Consolas, ui-monospace, monospace; background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; }
  .radio { display: flex; flex-direction: column; gap: 8px; }
  .radio label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .error { color: var(--bad); font-size: 12.5px; }
</style>
</head>
<body>
<div class="app" id="app">
  <nav id="nav">
    <div class="brand"><span class="dot"></span>Rujarvis</div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script src="settings.js"></script>
</body>
</html>
