<!doctype html>
<html lang="ru" data-look="ring">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob:">
<title>Rujarvis</title>
<link rel="stylesheet" href="looks.css">
<style>
  /* Цвета, шрифты и скругления — из looks.css: здесь только раскладка окна
     и то, чем виды различаются именно в нём. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-size: 14px; line-height: 1.5; }
  .app { display: grid; grid-template-columns: 210px 1fr; height: 100%; }
  .app.wizard { grid-template-columns: 1fr; }
  nav { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 3px; }
  .wizard nav { display: none; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; font-weight: 700; font-size: 16px; }
  nav button { text-align: start; background: none; border: 0; padding: 8px 12px; border-radius: var(--radius-btn); color: var(--muted); cursor: pointer; font-weight: 500; }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--text); }
  main { overflow-y: auto; padding: 26px 34px 34px; --margin-at: 18px; }
  .wizard main { padding: 36px max(56px, calc(50% - 330px)) 34px; --margin-at: max(28px, calc(50% - 360px)); }
  h1 { font-size: 24px; margin: 0 0 6px; font-weight: 600; line-height: 1.2; }
  h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .hint { margin: 0 0 18px; }
  .card { padding: 16px 18px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row + .row { margin-top: 10px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .choice { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .choice button { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; text-align: start; position: relative; }
  .choice button:hover { border-color: var(--line-2); }
  .choice button.selected { border: 2px solid var(--accent); padding: 15.5px 17.5px; }
  .choice b { display: inline-block; font-size: 16px; margin-bottom: 2px; }
  .choice span { display: block; color: var(--muted); font-size: 13px; }
  input[type=text] { flex: 1; min-width: 0; }
  label.field { display: block; margin-bottom: 4px; font-weight: 600; }
  .path { font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; color: var(--muted); word-break: break-all; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .model { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .model:first-child { border-top: 0; }
  .model .desc { color: var(--muted); font-size: 12.5px; }
  .footer { display: flex; justify-content: space-between; margin-top: 24px; }
  .kbd { font-family: Consolas, ui-monospace, monospace; background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; }
  .radio { display: flex; flex-direction: column; gap: 8px; }
  .radio label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--surface); border: 1px solid var(--line); padding: 8px 14px; border-radius: var(--radius-btn); opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .error { font-size: 12.5px; }
  .changes { margin: 8px 0 0; padding-inline-start: 20px; color: var(--text-2); }

  /* Шаги первого запуска: названия под чертой, нынешний — цветом вида. */
  .steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 24px; }
  .steps li { flex: 1; font-size: 12.5px; color: var(--muted); border-top: 3px solid var(--line); padding-top: 6px; }
  .steps li.done { border-color: var(--accent); }
  .steps li.now { border-color: var(--accent); color: var(--text); font-weight: 600; }
  .wiz-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; margin-bottom: 20px; }
  .wiz-brand .logo { width: 24px; height: 24px; }

  /* Вид: три карточки, каждая нарисована в своём виде. */
  .looks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .look-card { text-align: start; cursor: pointer; padding: 0; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; }
  .look-card.selected { outline: 3px solid var(--accent); outline-offset: 2px; }
  .look-mini { padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .look-mini .mini-pill { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 7px 10px; font-weight: 600; font-size: 12.5px; }
  .look-mini .mini-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--st-listen); flex: none; }
  .look-mini .mini-btns { display: flex; gap: 6px; }
  .look-mini .mini-btns i { height: 16px; flex: 1; border-radius: var(--radius-btn); background: var(--surface-2); border: 1px solid var(--line); }
  .look-mini .mini-btns i:first-child { background: var(--accent); border-color: var(--accent); }
  .look-name { padding: 8px 12px 12px; border-top: 1px solid var(--line); background: var(--surface); }
  .look-name b { display: block; font-size: 15px; }
  .look-name span { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 1px; }
  .seg { display: inline-flex; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: calc(var(--radius-btn) + 3px); }
  .seg button { background: none; border: 0; padding: 5px 14px; border-radius: var(--radius-btn); cursor: pointer; color: var(--muted); font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .notes-styles { display: flex; flex-direction: column; gap: 8px; }
  .notes-styles button { display: flex; gap: 12px; align-items: flex-start; text-align: start; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 11px 14px; cursor: pointer; }
  .notes-styles button i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; margin-top: 3px; }
  .notes-styles button.selected { border-color: var(--accent); }
  .notes-styles button.selected i { border: 5px solid var(--accent); }
  .notes-styles b { display: block; }
  .notes-styles span { display: block; color: var(--muted); font-size: 13px; }

  /* ——— Тетрадь ——— */
  [data-look="tetrad"] nav button.active { position: relative; }
  [data-look="tetrad"] nav button.active::after { content: ""; position: absolute; left: 12px; right: 30%; bottom: 3px; height: 3px; border-radius: 3px; background: var(--accent); transform: rotate(-1deg); }
  [data-look="tetrad"] main > h1, [data-look="tetrad"] .wizard main > h1 { font-family: var(--font-hand); font-weight: 700; font-size: 40px; line-height: 1; margin-bottom: 10px; }
  [data-look="tetrad"] .card { box-shadow: 0 1px 0 var(--line); }
  [data-look="tetrad"] .choice button.selected::after { content: "✓"; position: absolute; right: 14px; top: 4px; font: 700 32px/1 var(--font-hand); color: var(--accent); }
  [data-look="tetrad"] .steps li.now { font-family: var(--font-hand); font-size: 19px; line-height: 1; padding-top: 4px; }

  /* ——— Маркер ——— */
  [data-look="marker"] nav button.active span, [data-look="marker"] .choice button.selected b, [data-look="marker"] .steps li.now span {
    background: color-mix(in srgb, var(--m-yellow) var(--mk), transparent); border-radius: 3px 8px 4px 9px / 8px 4px 9px 4px;
    padding: 0 .22em; margin: 0 -.1em; color: var(--mk-ink);
  }
  [data-look="marker"] nav { background: var(--bg); }
  [data-look="marker"] main > h1 { font-size: 30px; letter-spacing: -0.02em; }
  [data-look="marker"] .choice button.selected, [data-look="marker"] .notes-styles button.selected { border-color: var(--text); }
  [data-look="marker"] .steps li { border-top: 0; padding-top: 0; font-size: 13.5px; counter-increment: step; }
  [data-look="marker"] .steps { counter-reset: step; gap: 20px; }
  [data-look="marker"] .steps li { flex: none; }
  [data-look="marker"] .steps li::before { content: counter(step) " "; font-weight: 600; }

  /* ——— Кольцо ——— */
  [data-look="ring"] nav { gap: 4px; }
  [data-look="ring"] nav button.active { background: var(--surface-2); }
  [data-look="ring"] .card { border: 0; }
  [data-look="ring"] main > h1 { font-weight: 500; font-size: 28px; }
  [data-look="ring"] .choice button:not(.selected), [data-look="ring"] .notes-styles button:not(.selected) { border-color: transparent; }
  [data-look="ring"] .steps li { flex: none; border: 0; padding: 4px 12px 4px 6px; background: var(--surface); border-radius: 99px; display: flex; align-items: center; gap: 7px; }
  [data-look="ring"] .steps li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-2); }
  [data-look="ring"] .steps li.done::before { border-color: var(--accent); background: var(--accent); }
  [data-look="ring"] .steps li.now::before { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 2.5px, transparent 3px); }
  [data-look="ring"] .steps li.now { font-weight: 500; }
</style>
</head>
<body>
<div class="app" id="app">
  <nav id="nav">
    <div class="brand"><span class="logo"></span>Rujarvis</div>
  </nav>
  <main id="main" class="paper"></main>
</div>
<div class="toast" id="toast"></div>
<script src="settings.js"></script>
</body>
</html>
